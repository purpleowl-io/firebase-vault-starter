# Runs the security rules tests on every push and pull request.
# A red X here means a change would let someone see or change data they shouldn't.
name: Security rules tests

on:
  push:
  pull_request:

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm run test:rules
